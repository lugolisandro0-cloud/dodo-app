<!doctype html><html><head><style>
@font-face{font-family:A;src:url(alfa-slab-one-latin-400-normal.woff2)}
html,body{margin:0;background:transparent}canvas{display:block}
</style></head><body><canvas id="c" width="1024" height="1024"></canvas><script>
document.fonts.load("10px A").then(()=>{
const c=document.getElementById("c"),x=c.getContext("2d"),w=1024,h=1024;let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const full=location.hash==="#full";
if(!full){x.beginPath();x.roundRect(0,0,w,h,0);x.clip()}
x.fillStyle="#ffc93c";x.fillRect(0,0,w,h);x.strokeStyle="rgba(232,132,42,.55)";x.lineCap="round";
for(let i=0;i<2600;i++){const a=rnd()*w,b=rnd()*h,l=10+rnd()*30,an=-1.3+rnd()*.5;x.lineWidth=2+rnd()*3;x.beginPath();x.moveTo(a,b);x.lineTo(a+Math.cos(an)*l,b+Math.sin(an)*l);x.stroke()}
const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#8fd06a");g.addColorStop(1,"#1d8a5c");const step=128,band=56;
for(let x0=-step;x0<w+step;x0+=step){const ph=rnd()*6.28,amp=18+rnd()*26,f1=.008+rnd()*.006,pts=[];for(let y=-20;y<=h+20;y+=8)pts.push([x0+Math.sin(y*f1+ph)*amp,y,band*.5*(.75+.4*Math.sin(y*.012+ph))]);
x.beginPath();pts.forEach(([a,b,bb],i)=>i?x.lineTo(a-bb,b):x.moveTo(a-bb,b));for(let i=pts.length-1;i>=0;i--){const[a,b,bb]=pts[i];x.lineTo(a+bb,b)}x.closePath();x.fillStyle=g;x.fill()}
x.font="330px A";x.textAlign="center";x.textBaseline="middle";x.lineJoin="round";
const t="DODO",fs=full?168:236;x.font=fs+"px A";
const cy=full?512:520;
x.fillStyle="#141210";x.fillText(t,512+16,cy+16);
x.lineWidth=full?18:24;x.strokeStyle="#141210";x.strokeText(t,512,cy);x.fillStyle="#fbfaf4";x.fillText(t,512,cy);
document.title="ok";});
</script></body></html>
