<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2a9d5c">
<title>DODO · Central</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<script>
/* Actualizaciones: si hay una versión descargada más nueva que la instalada, se usa esa. */
(function(){
  var V="1.2.0";window.APP_VERSION=V;window.APP_BASE=window.APP_BASE||V;
  function cmp(a,b){a=String(a).split(".").map(Number);b=String(b).split(".").map(Number);for(var i=0;i<3;i++){var d=(a[i]||0)-(b[i]||0);if(d)return d>0?1:-1}return 0}
  window.cmpVersion=cmp;
  if(window.__dodoSwap)return;
  try{
    if(localStorage.getItem("dodo-update-off")==="1")return;
    var u=JSON.parse(localStorage.getItem("dodo-update")||"null");
    if(!u||!u.html||cmp(u.v,V)<=0)return;
    if(u.base&&cmp(window.APP_BASE,u.base)<0)return;
    var p=localStorage.getItem("dodo-update-arranque");
    if(p===u.v){localStorage.removeItem("dodo-update");localStorage.removeItem("dodo-update-arranque");localStorage.setItem("dodo-update-mala",u.v);return}
    localStorage.setItem("dodo-update-arranque",u.v);
    window.__dodoSwap=1;
    document.write('<plaintext style="display:none">');
    var cambiar=function(){document.open();document.write(u.html);document.close()};
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(cambiar,0)});else setTimeout(cambiar,0);
  }catch(e){}
})();
</script>
<style>
@font-face{font-family:"Alfa Slab One";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/alfa-slab-one-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Rubik";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/rubik-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Rubik";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/rubik-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Rubik";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/rubik-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Rubik";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/rubik-latin-800-normal.woff2") format("woff2")}
/* Layout: una columna. Ondas de DODO en la cabecera, fondo liso. Celular: pestañas abajo. Compu: arriba. Modo noche automático o manual. */
:root{
  --yellow:#ffc93c;--orange:#e8842a;--green:#2a9d5c;--green-dark:#137a5a;--green-light:#8fd06a;
  --ink:#141210;--bg:#fff3c9;--card:#fffdf5;--muted:#6a604c;--bad:#d6301f;
  --line:#141210;--field:#ffffff;--on-light:#141210;--chip-grey:#e2dccb;--hero-dim:0;
  --display:"Alfa Slab One","Rockwell",Georgia,serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;--tabh:68px;color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-mode="light"]){
  --bg:#17140f;--card:#252019;--ink:#f4ead2;--muted:#b8ab8e;--line:#050403;--field:#1c1813;--chip-grey:#3a3328;
  --yellow:#e8b42e;--orange:#de7a22;--green:#228a50;--green-dark:#86dba5;--green-light:#79bf57;--bad:#ff5a47;--hero-dim:.42;color-scheme:dark}}
:root[data-mode="dark"]{
  --bg:#17140f;--card:#252019;--ink:#f4ead2;--muted:#b8ab8e;--line:#050403;--field:#1c1813;--chip-grey:#3a3328;
  --yellow:#e8b42e;--orange:#de7a22;--green:#228a50;--green-dark:#86dba5;--green-light:#79bf57;--bad:#ff5a47;--hero-dim:.42;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
a{color:var(--green-dark);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hidden,[hidden]{display:none !important}

.hero{position:relative;overflow:hidden;border-bottom:4px solid var(--line);background:var(--yellow)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:#0d0b08;opacity:var(--hero-dim);pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.slab{font-family:var(--display);font-weight:400;color:#fbfaf4;-webkit-text-stroke:2px #141210;paint-order:stroke fill;text-shadow:4px 4px 0 #141210;line-height:1;margin:0}
.hero h1{font-size:clamp(42px,10vw,68px)}
.hero-r{display:flex;align-items:center;gap:8px}
.round{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:3px 3px 0 var(--line);padding:0}
.round svg{width:22px;height:22px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--muted);border:2px solid var(--line)}
.dot.on{background:var(--green-light)} .dot.off{background:var(--bad)} .dot.busy{background:var(--yellow)}

nav.tabbar{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:3px solid var(--line)}
nav.tabbar .in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav.tabbar button{position:relative;background:none;border:0;padding:10px 4px;min-height:58px;cursor:pointer;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}
nav.tabbar button svg{width:24px;height:24px}
nav.tabbar button[aria-selected="true"]{color:var(--on-light);background:var(--yellow)}
.badge{position:absolute;top:5px;left:calc(50% + 5px);min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.badge:empty{display:none}

main{max-width:900px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:16px}
.view{display:grid;gap:16px}
.banner{padding:12px 14px;border-radius:12px;background:var(--card);border:3px solid var(--bad);font-size:15px;font-weight:500}
.sec-title{font-family:var(--display);font-weight:400;font-size:23px;margin:4px 0 0}
.note{font-size:14px;color:var(--muted)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.btn{border:3px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:800;box-shadow:3px 3px 0 var(--line);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;text-align:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--green);color:#fff}
.btn.hot{background:var(--orange);color:var(--on-light)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.link-btn{background:none;border:0;padding:8px 4px;font-weight:700;text-decoration:underline;cursor:pointer;color:var(--muted);font-size:14px}
input,select,textarea{background:var(--field);border:2px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;font-size:16px;width:100%}
textarea{min-height:96px;resize:vertical}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fields .full{grid-column:1/-1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:3px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:10px;font-weight:800;cursor:pointer;min-height:46px;color:var(--ink)}
.seg button+button{border-left:3px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--on-light)}
.seg.money button[aria-pressed="true"][data-v="ingreso"]{background:var(--green-light)}
.seg.money button[aria-pressed="true"][data-v="gasto"]{background:var(--orange)}

/* radar */
.big-op{background:var(--green);border:4px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--line);padding:18px;display:grid;gap:12px;color:#fff}
.big-op .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tag{display:inline-block;background:var(--yellow);color:var(--on-light);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;margin:0 6px 6px 0}
.tag.new{background:var(--orange)}
.big-op h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(23px,6vw,32px);line-height:1.1;text-wrap:balance}
.days{flex:0 0 auto;background:var(--yellow);color:var(--on-light);border:3px solid var(--line);border-radius:16px;padding:8px 12px;text-align:center;min-width:88px}
.days b{display:block;font-family:var(--display);font-weight:400;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.days span{font-size:12px;font-weight:800;text-transform:uppercase}
.days.urgent{background:var(--bad);color:#fff}
.todo{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600}
.todo small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800}
.op-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op-more{display:flex;flex-wrap:wrap;gap:2px 14px}
.big-op .op-more .link-btn{color:#fff}
.radar-when{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.ping{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--orange);border:2px solid var(--line);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(232,132,42,.9)}100%{box-shadow:0 0 0 10px rgba(232,132,42,0)}}

/* tarjetas */
.list{display:grid;gap:12px}
.card{background:var(--card);border:3px solid var(--line);border-left-width:12px;border-radius:var(--r);padding:14px;display:grid;gap:8px;box-shadow:3px 3px 0 var(--line)}
.card.red{border-left-color:var(--bad)} .card.orange{border-left-color:var(--orange)} .card.green{border-left-color:var(--green)} .card.light{border-left-color:var(--green-light)} .card.yellow{border-left-color:var(--yellow)}
.card h3{margin:0;font-size:18px;line-height:1.25}
.card .sub{font-size:14px;color:var(--muted)}
.card .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card .btns{display:flex;gap:10px;flex-wrap:wrap}
.card .btns .btn{flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;border:2px solid var(--line);background:var(--field)}
.pill.yellow{background:var(--yellow);color:var(--on-light)} .pill.orange{background:var(--orange);color:var(--on-light)} .pill.green{background:var(--green-light);color:var(--on-light)} .pill.grey{background:var(--chip-grey);color:var(--muted)} .pill.red{background:var(--bad);color:#fff}
.due{font-size:14px;font-weight:700}
.due.bad{color:var(--bad)}
.empty{padding:20px;text-align:center;font-weight:600;background:var(--card);border:3px dashed var(--line);border-radius:var(--r)}
.panel{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;box-shadow:3px 3px 0 var(--line)}
.panel h3{margin:0;font-size:18px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;box-shadow:3px 3px 0 var(--line)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.stat.hot{background:var(--orange);color:var(--on-light)} .stat.hot span{color:var(--on-light)}
.stat.good{background:var(--green-light);color:var(--on-light)} .stat.good span{color:var(--on-light)}

.search{display:flex;gap:10px}
.search .btn{flex:0 0 auto}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:40px;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* plata */
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month b{font-family:var(--display);font-weight:400;font-size:22px}
.money{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.money.in{color:var(--green-dark)} .money.out{color:var(--bad)}
.mov{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.mov .money{font-size:18px}
.per{display:grid;gap:6px}
.per div{display:flex;justify-content:space-between;gap:10px;border-bottom:2px dashed var(--chip-grey);padding-bottom:6px}

/* más */
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.menu button{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;box-shadow:3px 3px 0 var(--line);display:grid;gap:4px;color:var(--ink)}
.menu button b{font-size:17px}
.menu button span{font-size:13px;color:var(--muted)}
.check{display:grid;gap:6px}
.check div{display:flex;gap:8px;align-items:center;font-weight:600}
.ok{color:var(--green-dark);font-weight:800}.no{color:var(--bad);font-weight:800}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;letter-spacing:.08em;text-align:center;background:var(--yellow);color:var(--on-light);border:3px solid var(--line);border-radius:12px;padding:12px}
.result{background:var(--yellow);color:var(--on-light);border:3px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.result .note{color:var(--on-light);opacity:.8}
.result b{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.verdict{background:var(--green);color:#fff;border:3px solid var(--line);border-radius:var(--r);padding:14px 16px;font-weight:500;box-shadow:3px 3px 0 var(--line)}
.verdict strong{display:block;font-size:18px;margin-bottom:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* paquetes */
.lema{font-size:clamp(26px,6.5vw,40px);text-wrap:balance}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.pkg{background:var(--card);border:4px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line);padding:16px;display:grid;gap:10px}
.pkg.star{background:var(--green);color:#fff}
.pkg .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.pkg h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05}
.pkg .price{font-family:var(--display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.pkg ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.pkg.star .note{color:#fff;opacity:.92}
.pkg .btns{display:flex;flex-wrap:wrap;gap:8px}
.pkg .btns .btn:first-child{flex:1}
.pkg .flag{justify-self:start;background:var(--yellow);color:var(--on-light);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.panel ul{margin:0;padding-left:18px;display:grid;gap:6px}
.quote-total{background:var(--yellow);color:var(--on-light);border:3px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.quote-total b{font-family:var(--display);font-weight:400;font-size:32px;font-variant-numeric:tabular-nums;line-height:1.1}
.quote-total .per div{border-bottom-color:rgba(20,18,16,.25)}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.checks input{width:24px;min-height:24px;flex:0 0 auto}
.checks .money{margin-left:auto;font-size:14px}

/* alquiler */
.precios{display:grid;gap:4px;font-size:14px;background:var(--field);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.precios div{display:flex;justify-content:space-between;gap:10px}
.precios div+div{border-top:2px dashed var(--chip-grey);padding-top:4px}
details.panel summary{font-weight:800;font-size:17px;cursor:pointer}
details.panel ol{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}

/* diálogos */
dialog{border:4px solid var(--line);border-radius:20px;padding:0;background:var(--card);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100% - 24px);box-shadow:6px 6px 0 var(--line)}
dialog::backdrop{background:rgba(10,8,6,.6)}
.dlg{padding:18px;display:grid;gap:14px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dlg h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.close{flex:0 0 auto;width:46px;height:46px;border:3px solid var(--line);border-radius:12px;background:var(--field);font-size:22px;font-weight:800;cursor:pointer;color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.quick .item{background:var(--field);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;word-break:break-word;color:var(--ink);text-decoration:none;text-align:left;cursor:pointer}
.quick .item small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.log{display:grid;gap:4px;font-size:14px;max-height:150px;overflow:auto;background:var(--field);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.log div{display:flex;gap:10px}
.log time{color:var(--muted);white-space:nowrap}
.dlg-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.fab{position:fixed;right:18px;bottom:24px;z-index:5;width:62px;height:62px;border-radius:50%;border:3px solid var(--line);background:var(--orange);color:var(--on-light);font-size:34px;font-weight:800;line-height:1;cursor:pointer;box-shadow:4px 4px 0 var(--line)}
.toast{position:fixed;z-index:30;left:50%;bottom:28px;transform:translateX(-50%);background:#141210;color:#ffc93c;border:2px solid #ffc93c;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
.alert{position:fixed;inset:0;z-index:25;background:rgba(10,8,6,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.alert-box{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--orange);color:var(--on-light);border:4px solid var(--line);border-radius:22px;box-shadow:8px 8px 0 var(--line);padding:20px;display:grid;gap:14px;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.alert-box h2{margin:0;font-size:clamp(30px,8vw,44px)}
.alert-item{background:#fffdf5;color:#141210;border:3px solid #141210;border-radius:14px;padding:12px}
.alert-item b{display:block;font-size:17px;line-height:1.25}
.alert-item span{font-size:14px;font-weight:700}
.alert-item span.bad{color:#d6301f}
.updbar{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;background:var(--green);color:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:4px 4px 0 var(--line)}
.updbar span{flex:1 1 200px}

/* acceso */
#acceso{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
#acceso .in{max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 18px 40px;display:grid;gap:16px}
#acceso h1{font-size:64px;text-align:center}
#acceso .err{background:var(--bad);color:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}

@media (min-width:761px){nav.tabbar button{flex-direction:row;gap:8px;font-size:15px}.badge{position:static;margin-left:2px}}
@media (max-width:760px){

<script>
"use strict";
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a||{})){if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?"":v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const parse=s=>{if(!s)return null;const[y,m,d]=String(s).slice(0,10).split("-").map(Number);if(!y)return null;return new Date(y,m-1,d)};
const fmt=d=>d?d.toLocaleDateString("es-AR",{day:"numeric",month:"short"}):"—";
const diff=(a,b)=>Math.round((b-a)/86400000);
const safeUrl=u=>{if(!u)return null;const s=String(u).trim();return /^https?:\/\//i.test(s)?s:"https://"+s};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const money=(n,m)=>(n<0?"−":"")+(m==="USD"?"US$ ":"$ ")+Math.abs(Math.round(n)).toLocaleString("es-AR");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2800)}
async function copiar(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Copiado")}catch(e){const a=el("textarea",{style:"position:fixed;opacity:0"});a.value=t;document.body.append(a);a.select();try{document.execCommand("copy");toast(msg||"Copiado")}catch(e2){toast("No se pudo copiar")}a.remove()}}
function abrirLink(u){if(!u)return;try{if(window.dodoDesktop&&window.dodoDesktop.abrir){window.dodoDesktop.abrir(u);return}}catch(e){}const w=window.open(u,"_blank");if(!w)location.href=u}

/* ================= entorno ================= */
const esEscritorio=()=>!!window.dodoDesktop||/Electron/i.test(navigator.userAgent||"");
const esNativo=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const LN=()=>esNativo()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const UPD_BASE="https://raw.githubusercontent.com/lugolisandro0-cloud/dodo-app/main/";
const RADAR_URL=(UPD_BASE&&UPD_BASE.indexOf("__")!==0?UPD_BASE:"https://raw.githubusercontent.com/lugolisandro0-cloud/dodo-app/main/")+"radar/radar.json";
const SEMILLA_URL=RADAR_URL.replace("radar/radar.json","semilla/contactos.json");

/* ================= datos ================= */
const CATS=[{k:"planner",n:"Wedding planner",cad:14},{k:"productora",n:"Productora de eventos",cad:14},{k:"hotel",n:"Hotel / salón",cad:21},{k:"agencia",n:"Agencia de cruceros",cad:30},{k:"naviera",n:"Naviera",cad:45},{k:"tematico",n:"Crucero temático / festival",cad:30},{k:"artista",n:"Artista / músico",cad:30},{k:"proveedor",n:"Proveedor de alquiler",cad:60},{k:"cliente",n:"Cliente particular",cad:7},{k:"otro",n:"Otro",cad:21}];
const STATUSES=[{k:"pend",n:"Por contactar",c:""},{k:"cont",n:"Contactado",c:"yellow"},{k:"conv",n:"En conversación",c:"orange"},{k:"prop",n:"Propuesta enviada",c:"orange"},{k:"won",n:"Trabajando juntos",c:"green"},{k:"lost",n:"Descartado",c:"grey"}];
const KINDS={crucero:"Crucero",evento:"Eventos",festival:"Festival",hotel:"Temporada / hotel",otro:"Oportunidad"};
const CATEG_MOV={ingreso:["Show / evento","Seña","Crucero","Venta / merch","Otro"],gasto:["Sala de ensayo","Equipos","Transporte / flete","Sonido / técnica","Contenido / video / fotos","Pago a integrantes","Músico invitado","Comisión","Comida / viáticos","Otro"]};
const MEDIOS=["Transferencia","Efectivo","Mercado Pago","Dólares billete","Otro"];
const catBy=Object.fromEntries(CATS.map(c=>[c.k,c])),stBy=Object.fromEntries(STATUSES.map(s=>[s.k,s]));
const LS_DATOS="dodo-datos",LS_RADAR="dodo-radar",LS_SYNC="dodo-sesion";
let D={contactos:{},radar:{},movimientos:{},config:{}};
let RADAR={items:[],actualizado:""};
(function(){const r=lsGet(LS_DATOS,null);if(r)for(const k in D)if(r[k])D[k]=r[k];const x=lsGet(LS_RADAR,null);if(x&&x.items)RADAR=x})();
const lsSave=()=>lsSet(LS_DATOS,D);
const lista=col=>Object.entries(D[col]).map(([id,v])=>({...v,id}));
const contactos=()=>lista("contactos");
const kit=()=>D.config.kit||{};
const PRES_DEF="https://drive.google.com/file/d/10Itx0oTVjrMm8VSk8OT4NuNux2f6iGMK/view";
const presLink=()=>{const k=kit();return k.presentacion==null?PRES_DEF:(k.presentacion||"")};
const presPreview=u=>{const m=String(u||"").match(/drive\.google\.com\/file\/d\/([\w-]+)/);return m?"https://drive.google.com/file/d/"+m[1]+"/preview":""};
const textoPres=()=>`🎺 DODO · Presentación de shows\nAcá tenés nuestra propuesta con los formatos, qué incluye cada uno y las condiciones:\n${presLink()}`;
const banda=()=>D.config.banda||{};
function guardar(col,id,data){
  if(data){const{id:_,...r}=data;D[col][id]=r}else delete D[col][id];
  lsSave();sync.push(col,id,data);planificarAvisos();render();
}

/* ================= sincronización con Google ================= */
let yo={id:"",nombre:""},socios=[],servidorMails=0;
const sync=(()=>{
  let cfg={url:"",token:"",id:"",nombre:"",last:"",cola:[]},timer=null,enCurso=false,otraVez=false,ultimo=null,error="";
  cfg={...cfg,...lsGet(LS_SYNC,{})};
  const save=()=>lsSet(LS_SYNC,cfg);
  const activo=()=>!!(cfg.url&&cfg.token);
  const ponerYo=()=>{yo={id:cfg.id||"",nombre:cfg.nombre||""}};ponerYo();
  async function llamar(body,url){
    const ctrl=typeof AbortController!=="undefined"?new AbortController():null;const to=setTimeout(()=>ctrl&&ctrl.abort(),45000);
    try{
      const r=await fetch(url||cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,token:body.token===undefined?cfg.token:body.token}),redirect:"follow",signal:ctrl?ctrl.signal:undefined});
      const txt=await r.text();let j;
      try{j=JSON.parse(txt)}catch(e){throw new Error(/<html/i.test(txt)?"Google no devolvió datos. Revisá que la implementación sea \"Aplicación web\" con acceso para \"Cualquier usuario\".":"Respuesta inesperada de Google.")}
      if(j.sesion===false&&cfg.token){sesionVencida(j.error);throw new Error(j.error)}
      if(!j.ok)throw new Error(j.error||"Google devolvió un error.");
      return j;
    }catch(e){if(e.name==="AbortError")throw new Error("Google tardó demasiado en responder.");throw e}
    finally{clearTimeout(to)}
  }
  function push(col,id,data){
    if(!activo())return;
    const d=data?(({id:_,...r})=>r)(data):{};
    cfg.cola=cfg.cola.filter(x=>!(x.col===col&&x.id===id));cfg.cola.push({col,id,data:d,deleted:!data});
    save();pintarSync();clearTimeout(timer);timer=setTimeout(ciclo,700);
  }
  function aplicar(filas){
    let cambio=false;
    for(const x of filas){
      if(x.updated_at>cfg.last)cfg.last=x.updated_at;
      if(!D[x.col])continue;
      if(cfg.cola.some(c=>c.col===x.col&&c.id===x.id))continue;
      if(x.deleted)delete D[x.col][x.id];else D[x.col][x.id]=x.data||{};
      cambio=true;
    }
    return cambio;
  }
  async function ciclo(){
    if(!activo())return;
    if(enCurso){otraVez=true;return}
    enCurso=true;pintarSync();
    try{
      const env=cfg.cola.slice(0,300);
      const j=await llamar({accion:"sync",since:cfg.last,cambios:env});
      cfg.cola=cfg.cola.filter(x=>!env.includes(x));
      const cambio=aplicar(j.filas||[]);
      socios=j.socios||socios;servidorMails=j.mails||0;
      const me=socios.find(s=>s.id===cfg.id);if(me&&me.nombre!==cfg.nombre){cfg.nombre=me.nombre;ponerYo()}
      lsSet("dodo-socios",socios);save();ultimo=new Date();error="";
      if(cambio||env.length){lsSave();planificarAvisos();render()}
    }catch(e){if(activo())error=navigator.onLine===false?"Sin internet. Se guarda cuando vuelva la conexión.":String(e.message||e)}
    enCurso=false;pintarSync();
    if(activo()&&(otraVez||cfg.cola.length)){otraVez=false;clearTimeout(timer);timer=setTimeout(ciclo,1500)}
  }
  function estado(){
    if(!activo())return"Sin conexión con Google";
    if(error)return"Google: "+error;
    if(cfg.cola.length)return"Guardando "+cfg.cola.length+" cambio"+(cfg.cola.length===1?"":"s")+"…";
    return ultimo?"Sincronizado · "+ultimo.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}):"Conectando…";
  }
  function color(){return !activo()?"off":error?"off":(enCurso||cfg.cola.length)?"busy":ultimo?"on":"busy"}
  async function entrar(url,body,semilla){
    const j=await llamar({...body,token:""},url);
    cfg={url,token:j.token,id:j.id,nombre:j.nombre||"",last:"",cola:[]};ponerYo();
    D={contactos:{},radar:{},movimientos:{},config:{}};
    if(semilla&&j.primera){
      try{const r=await fetch(SEMILLA_URL+"?t="+Date.now(),{cache:"no-store"});const arr=await r.json();
        arr.forEach(c=>{const{id,...rest}=c;const data={status:"pend",cadence:catBy[c.cat]?.cad||21,attempts:0,last:"",log:[],createdAt:iso(today()),...rest};D.contactos[id]=data;cfg.cola.push({col:"contactos",id,data,deleted:false})})}catch(e){}
    }
    save();lsSave();
    for(let i=0;i<20&&cfg.cola.length&&!error;i++)await ciclo();
    if(!cfg.cola.length)await ciclo();
    return j;
  }
  async function salir(){
    try{if(cfg.token)await llamar({accion:"salir"})}catch(e){}
    const url=cfg.url;cfg={url,token:"",id:"",nombre:"",last:"",cola:[]};save();ponerYo();
    D={contactos:{},radar:{},movimientos:{},config:{}};lsSave();cancelarAvisos();
  }
  function sesionVencida(msg){const url=cfg.url;cfg={url,token:"",id:"",nombre:"",last:"",cola:[]};save();ponerYo();setTimeout(()=>pantallaAcceso(msg||"Tu sesión se cerró. Volvé a entrar."),0)}
  return {push,ciclo,estado,color,activo,llamar,entrar,salir,url:()=>cfg.url,pendientes:()=>cfg.cola.length};
})();
socios=lsGet("dodo-socios",[]);
function pintarSync(){const d=$("#syncDot");if(d)d.className="dot "+sync.color();const b=$("#syncBtn");if(b){b.title=sync.estado();b.setAttribute("aria-label","Sincronizar. "+sync.estado())}const f=$("#foot");if(f)f.textContent=sync.estado()}

/* ================= radar (archivo público en GitHub) ================= */
let radarVistoDisp=lsGet("dodo-radar-dispositivo",null);
async function leerRadar(){
  leerExtras();
  try{

  let t;draw();addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(draw,120)});
  const root=document.documentElement,btn=$("#modeBtn"),mq=matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
  const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const isDark=()=>{const m=root.dataset.mode;if(m)return m==="dark";return!!(mq&&mq.matches)};
  const paint=()=>{const d=isDark();btn.innerHTML=d?SUN:MOON;btn.setAttribute("aria-label",d?"Cambiar a modo día":"Cambiar a modo noche");const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=d?"#17140f":"#2a9d5c"};
  const s=lsGet("dodo-mode",null);if(s==="dark"||s==="light")root.dataset.mode=s;paint();
  btn.addEventListener("click",()=>{const n=isDark()?"light":"dark";root.dataset.mode=n;lsSet("dodo-mode",n);paint()});
  if(mq&&mq.addEventListener)mq.addEventListener("change",paint);
})();

/* ================= arranque ================= */
(function iniciar(){
  try{actualizacion.arranqueOk()}catch(e){}
  render();
  const L=LN();
  if(L){
    L.checkPermissions().then(p=>{permisoAvisos=p.display;planificarAvisos();render()}).catch(()=>{});
    try{L.addListener("localNotificationActionPerformed",a=>{const t=a&&a.notification&&a.notification.extra&&a.notification.extra.tab;if(t)showTab(t)})}catch(e){}
    const App=window.Capacitor.Plugins.App;
    if(App){
      const abrirUrl=u=>{const l=leerVinculo(u||"");if(l&&!sync.activo())pantallaAcceso("",{u:l.u,c:l.c})};
      try{App.addListener("appUrlOpen",e=>abrirUrl(e.url))}catch(e){}
      try{App.getLaunchUrl().then(r=>r&&abrirUrl(r.url)).catch(()=>{})}catch(e){}
      try{App.addListener("appStateChange",s=>{if(s.isActive){sync.ciclo();leerRadar();render();setTimeout(revisarAlertas,1500)}})}catch(e){}
    }
  }else if("Notification"in window){permisoAvisos=Notification.permission==="granted"?"granted":Notification.permission}
  setTimeout(()=>actualizacion.revisar(false),5000);
  setInterval(()=>actualizacion.revisar(false),6*3600e3);
  setInterval(()=>{if(document.visibilityState==="visible"||esEscritorio())sync.ciclo()},esEscritorio()?60000:30000);
  setInterval(()=>leerRadar(),15*60000);
  setInterval(()=>{tickEscritorio();},60000);
  addEventListener("focus",()=>{sync.ciclo()});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){sync.ciclo();render();setTimeout(revisarAlertas,1200)}});
  addEventListener("online",()=>sync.ciclo());
  let dia=iso(today());setInterval(()=>{const d=iso(today());if(d!==dia){dia=d;planificarAvisos();render()}},60000);
  const h=location.hash.slice(1);showTab(TABS.includes(h)?h:"radar");
  leerRadar().then(()=>setTimeout(revisarAlertas,800));
  if(!sync.activo()){pantallaAcceso();return}
  sync.ciclo();setTimeout(tickEscritorio,5000);
})();
</script>
